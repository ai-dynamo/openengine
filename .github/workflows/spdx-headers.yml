name: SPDX header compliance

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  spdx_headers:
    name: SPDX headers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: false

      - name: Test the SPDX checker
        run: python -m unittest discover -s tests -p test_spdx_headers.py

      - name: Validate tracked files
        run: python scripts/check_spdx_headers.py
