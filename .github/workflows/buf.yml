name: Buf

on:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "tests/**"
      - "buf.yaml"
      - ".github/workflows/buf.yml"
  pull_request:
    paths:
      - "proto/**"
      - "tests/**"
      - "buf.yaml"
      - ".github/workflows/buf.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate schema
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: "1.72.0"
          lint: true
          format: true
          breaking: false
          push: false
          archive: false
          pr_comment: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check wire contracts
        run: |
          python -m pip install grpcio-tools==1.67.1 protobuf==5.27.2
          python -m unittest discover -s tests -v
